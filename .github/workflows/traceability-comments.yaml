name: traceability-comments

on:
  pull_request:
    branches:
      - dev
    types:
      - labeled
      - unlabeled
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  traceability-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./
        with:
          global_verification_strategy: comments
          github_api_token: ${{ secrets.GITHUB_TOKEN }}
