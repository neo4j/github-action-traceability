name: traceability

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      # Dogfoods the in-tree action against PRs to this repo (`uses: ./`).
      # Downstream consumers should pin a published version instead — see README.md.
      - uses: actions/checkout@v3
      - uses: ./
        with:
          global_verification_strategy: linked
          github_api_token: ${{ secrets.GITHUB_TOKEN }}
          linear_api_key: ${{ secrets.LINEAR_API_KEY }}
