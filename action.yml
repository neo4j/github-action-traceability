name: "Linear Traceability GitHub Action"
author: "Neo4j"
description: "Verifies that pull requests are linked to a Linear issue via the Linear API"
branding:
  icon: 'award'
  color: 'green'
inputs:
  global_verification_strategy:
    required: false
    default: "linked"
    description: "One of linked, disabled."
  github_api_token:
    required: true
    description: "API token for GitHub. Use GitHub secrets, do not paste plaintext."
  linear_api_key:
    required: false
    description: "Linear API personal access token (Settings → API). Required when global_verification_strategy is 'linked'. Use GitHub secrets, do not paste plaintext."
runs:
  using: "node20"
  main: "dist/index.js"
