name: "Linear Traceability GitHub Action"
author: "Neo4j"
description: "Verifies that pull requests are linked to a Linear issue via the Linear API"
branding:
  icon: 'award'
  color: 'green'
inputs:
  global_verification_strategy:
    required: false
    default: "linked"
    description: "One of linked, disabled."
  github_api_token:
    required: true
    description: "API token for GitHub. Use GitHub secrets, do not paste plaintext."
  linear_api_key:
    required: false
    description: "Linear personal API key (Settings → Security & Access). One of linear_api_key OR (linear_client_id + linear_client_secret) is required when global_verification_strategy is 'linked'. Personal API keys do not expire unless you set an expiration on them. Use GitHub secrets, do not paste plaintext."
  linear_client_id:
    required: false
    description: "Client ID of a Linear OAuth application (Settings → API → OAuth applications). Provide together with linear_client_secret to authenticate via the client-credentials grant: the action mints a fresh 30-day app token on every run, so the credential never expires in practice. The application must have 'client credentials tokens' toggled on in Linear, or the grant is rejected. Takes precedence over linear_api_key when both are set. Setting only one of the pair is an error. The OAuth app only sees private teams it has been explicitly granted access to on its details page."
  linear_client_secret:
    required: false
    description: "Client secret for the linear_client_id OAuth application. Use GitHub secrets, do not paste plaintext."
  target_branches:
    required: false
    default: ""
    description: "Newline-separated list of base branches the action should run against. PRs whose base branch is not in the list are reported as success without contacting Linear. Empty (default) means run against all base branches. Useful when the consumer workflow cannot use the workflow-level `branches:` filter — e.g. so that changing the base branch of a PR re-paints the check status to green."
runs:
  using: "node20"
  main: "dist/index.js"
